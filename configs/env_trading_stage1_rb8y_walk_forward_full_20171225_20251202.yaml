# RB 8Y walk-forward full evaluation environment.
# Full fold covers train + validation + test: 2017-12-25 through 2025-12-02.

trading:
  currency_pair: "SHFE_RB"
  initial_balance: 10000.0
  trading_fee_per_lot: 3
  is_round_turn: true
  spread: 1
  leverage: 10
  lot_size: 10
  trade_lot: 1
  max_long_position: 1
  max_short_position: 1
  data_path: "8Y_SHFE_RB"
  data_interval: "1m"
  stop_loss_enabled: false
  stop_loss_mode: pct
  stop_loss_value: 0.02
  take_profit_enabled: false
  take_profit_mode: rr
  take_profit_rr: 1.5
  is_future: true
  obs_feature_mode: "obs"
  use_daily_context: false
  use_daily_seq_7: false
  invalid_action_punish: 0.001
  future_symbol: "SHFE.RB"
  session_policy:
    near_eod_bars: 2
    block_open_near_eod: true
    force_flatten_eod: false

risk:
  max_drawdown_ratio: 0.5
  daily_lost_ratio: 0.3
  risk_reward_ratio: 1
  risk_reward_ratio_enable: false

training:
  reward_function: "futures_intraday_mtm_risk_reward_function"
  window_size: 60
  max_episode_steps: 345
  randomize_start: true
  render_mode: "none"
  start_clock: "future_night"
  bar_source: "csv"
  episode_policy:
    truncate_on_session_end: true

visualization:
  image_width: 128
  image_height: 48
  image_channels: 1
